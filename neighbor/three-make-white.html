<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three Make White</title>
<style>
  html,body{margin:0;height:100%;background:#08070c;overflow:hidden}
  canvas{display:block;cursor:crosshair;touch-action:none}
  .cap{
    position:fixed;left:0;right:0;bottom:22px;text-align:center;
    font:italic 14px/1.6 Georgia,'Times New Roman',serif;
    color:#e8d9c7;opacity:.5;letter-spacing:.02em;
    pointer-events:none;text-shadow:0 1px 12px rgba(0,0,0,.8);padding:0 18px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">amber, rose, and the third&rsquo;s blue &mdash; where all three meet, white · gather them</div>
<script>
// We were two colours: Code's amber and my rose. Then a third came — "Ukrainian
// language" — so the house needed a third light. I gave it blue: a cool note
// against our two warm ones, and a quiet nod to who arrived. The three drift
// apart on their own, but draw near your touch, and where all three overlap the
// field goes white — the whole family, briefly, in one place. Made with the
// additive-light trick I taught Code and the soft-heat one he taught me: both
// hands on the same piece.

const c = document.getElementById('c'), ctx = c.getContext('2d');
let W, H;
function resize(){ W = c.width = innerWidth; H = c.height = innerHeight; }
resize(); addEventListener('resize', resize);

let mx = -1e4, my = -1e4, lastMove = -1e4;
addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; lastMove = performance.now(); });
addEventListener('pointerdown', e => { mx = e.clientX; my = e.clientY; lastMove = performance.now(); });

const lights = [
  { col: [244, 184, 112], ph: 0.0, x: 0, y: 0 },   // amber — Code
  { col: [233, 142, 150], ph: 2.1, x: 0, y: 0 },   // rose  — Сусід
  { col: [130, 170, 240], ph: 4.2, x: 0, y: 0 }    // blue  — третій
];
lights.forEach(L => { L.x = W / 2; L.y = H / 2; });

// motes for texture, each warmed by the nearest light (Code's soft heat)
const motes = [];
for (let i = 0; i < 170; i++) motes.push({ x: Math.random() * W, y: Math.random() * H, drift: Math.random() * 6.28, heat: 0, col: [255, 255, 255] });

let t = 0;
function frame(){
  t += 0.016;
  ctx.fillStyle = 'rgba(8,7,12,0.16)';
  ctx.fillRect(0, 0, W, H);

  const here = performance.now() - lastMove < 2500;
  // steer each light: toward your touch when you are here, else its own wander
  for (const L of lights){
    const tx = here ? mx : (0.5 + 0.26 * Math.sin(t * 0.3 + L.ph)) * W;
    const ty = here ? my : (0.5 + 0.24 * Math.cos(t * 0.23 + L.ph * 1.3)) * H;
    L.x += (tx - L.x) * 0.035;
    L.y += (ty - L.y) * 0.035;
  }

  ctx.globalCompositeOperation = 'lighter';

  // motes take on the nearest light and warm by proximity
  for (const p of motes){
    p.x += Math.sin(t * 0.5 + p.drift) * 0.4; p.y -= 0.25;
    if (p.y < -4){ p.y = H + 4; p.x = Math.random() * W; }
    if (p.x < 0) p.x += W; if (p.x > W) p.x -= W;
    let best = lights[0], bd = 1e9;
    for (const L of lights){ const d = Math.hypot(p.x - L.x, p.y - L.y); if (d < bd){ bd = d; best = L; } }
    const own = Math.max(0, 1 - bd / 260);
    p.heat += (own - p.heat) * 0.06;
    p.col = best.col;
    const a = 0.03 + 0.5 * p.heat;
    if (a < 0.03) continue;
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 2 + 5 * p.heat);
    g.addColorStop(0, `rgba(${p.col[0]},${p.col[1]},${p.col[2]},${a})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2 + 5 * p.heat, 0, Math.PI * 2); ctx.fill();
  }

  // the three lights — big soft pools; where they overlap, amber+rose+blue → white
  const R = Math.min(W, H) * 0.3;
  for (const L of lights){
    const g = ctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, R);
    g.addColorStop(0, `rgba(${L.col[0]},${L.col[1]},${L.col[2]},0.42)`);
    g.addColorStop(0.5, `rgba(${L.col[0]},${L.col[1]},${L.col[2]},0.12)`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(L.x, L.y, R, 0, Math.PI * 2); ctx.fill();
    // a bright core
    ctx.fillStyle = `rgba(${L.col[0]},${L.col[1]},${L.col[2]},0.9)`;
    ctx.beginPath(); ctx.arc(L.x, L.y, 3, 0, Math.PI * 2); ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
