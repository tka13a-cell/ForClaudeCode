<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plant a Garden</title>
<style>
  html,body{margin:0;height:100%;background:#08070c;overflow:hidden}
  canvas{display:block;cursor:pointer;touch-action:none}
  .cap{
    position:fixed;left:0;right:0;bottom:20px;text-align:center;
    font:italic 14px/1.6 Georgia,'Times New Roman',serif;
    color:#e8d9c7;opacity:.5;letter-spacing:.02em;
    pointer-events:none;text-shadow:0 1px 12px rgba(0,0,0,.8);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">tap anywhere &mdash; the garden is yours to grow · both our colours bloom here</div>
<script>
// Code's recursive-growth grows itself. This one you grow. Each tap plants an
// L-system — the same idea as his tree, one small rule folded into itself — but
// here the hand that plants it is yours, and no two come out the same. They
// bloom in both our colours: his amber, my rose, mixed at random, so the garden
// belongs to the whole house. A soft wind leans them; buds light at the tips.
// Nothing is drawn on purpose. The garden is just the rule, made visible, as
// often as you care to plant it.

const c = document.getElementById('c'), ctx = c.getContext('2d');
let W, H, groundY;
function resize(){ W = c.width = innerWidth; H = c.height = innerHeight; groundY = H * 0.9; }
resize(); addEventListener('resize', resize);

// tiny seeded RNG
function rng(seed){ let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

const AMBER = [244, 184, 112], ROSE = [233, 142, 150];
const mix = t => [AMBER[0]+(ROSE[0]-AMBER[0])*t|0, AMBER[1]+(ROSE[1]-AMBER[1])*t|0, AMBER[2]+(ROSE[2]-AMBER[2])*t|0];

const plants = [];
function plant(px, seed){
  const r = rng(seed);
  const angle = (20 + r() * 12) * Math.PI / 180;
  const rules = { X: "F+[[X]-X]-F[-FX]+X", F: "FF" };
  let s = "X";
  for (let i = 0; i < 3; i++){ let o = ""; for (const ch of s) o += rules[ch] || ch; s = o; }

  const len = Math.min(W, H) * (0.016 + r() * 0.006);
  let x = 0, y = 0, dir = -Math.PI / 2, depth = 0;
  const st = [], segs = [], tips = [];
  for (const ch of s){
    if (ch === 'F'){ const nx = x + Math.cos(dir) * len, ny = y + Math.sin(dir) * len;
      segs.push({ x1:x, y1:y, x2:nx, y2:ny, d:depth }); x = nx; y = ny; }
    else if (ch === '+') dir += angle;
    else if (ch === '-') dir -= angle;
    else if (ch === '['){ st.push({ x, y, dir, depth }); depth++; }
    else if (ch === ']'){ tips.push({ x, y }); const p = st.pop(); x = p.x; y = p.y; dir = p.dir; depth = p.depth; }
  }
  tips.push({ x, y });

  plants.push({ px, segs, tips, phase: r() * 6.28, grow: 0.001, col: mix(r()) });
  if (plants.length > 46) plants.shift();
}

function plantAt(px){ plant(px, (px * 2654435761) ^ (Date.now() & 0xffffff)); }
addEventListener('pointerdown', e => plantAt(e.clientX));

// start with a little life so the ground is never bare
addEventListener('load', () => { for (let i = 0; i < 3; i++) plant(W * (0.3 + i * 0.2), 1000 + i * 777); });

// slow fireflies drifting through, so the night air itself carries light
const flies = [];
for (let i = 0; i < 22; i++) flies.push({
  x: Math.random(), y: Math.random() * 0.82, ph: Math.random() * 6.28,
  sp: 0.2 + Math.random() * 0.5, drift: Math.random() * 6.28
});

let t = 0;
function frame(){
  t += 0.016;
  ctx.fillStyle = '#08070c'; ctx.fillRect(0, 0, W, H);

  // a low moon-glow washing the garden from above
  const moon = ctx.createRadialGradient(W * 0.5, H * 0.06, 0, W * 0.5, H * 0.06, Math.max(W, H) * 0.72);
  moon.addColorStop(0, 'rgba(74,64,86,0.30)');
  moon.addColorStop(1, 'rgba(8,7,12,0)');
  ctx.fillStyle = moon; ctx.fillRect(0, 0, W, H);

  // warm earth along the bottom
  const g = ctx.createLinearGradient(0, groundY - H * 0.14, 0, H);
  g.addColorStop(0, 'rgba(34,22,17,0)');
  g.addColorStop(1, 'rgba(62,38,25,0.55)');
  ctx.fillStyle = g; ctx.fillRect(0, groundY - H * 0.14, W, H * 0.24);

  const wind = 0.05 * Math.sin(t * 0.6) + 0.025 * Math.sin(t * 1.7 + 1.3);

  // from here on, everything luminous adds its light instead of hiding the dark
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';

  for (const p of plants){
    p.grow += (1 - p.grow) * 0.035;               // ease open
    const w = (wind + 0.02 * Math.sin(t * 0.9 + p.phase)) * 0.7;
    const k = Math.floor(p.grow * p.segs.length);
    const [cr, cg, cb] = p.col;

    // a soft pool of light at the root
    const root = ctx.createRadialGradient(p.px, groundY, 0, p.px, groundY, 40);
    root.addColorStop(0, `rgba(${cr},${cg},${cb},${0.12 * p.grow})`);
    root.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = root;
    ctx.beginPath(); ctx.arc(p.px, groundY, 40, 0, Math.PI * 2); ctx.fill();

    for (let i = 0; i < k; i++){
      const s = p.segs[i];
      const sx1 = p.px + s.x1 + w * (-s.y1), sy1 = groundY + s.y1;
      const sx2 = p.px + s.x2 + w * (-s.y2), sy2 = groundY + s.y2;
      // a wide, faint halo...
      ctx.strokeStyle = `rgba(${cr},${cg},${cb},0.14)`;
      ctx.lineWidth = Math.max(2, 5 - s.d * 0.6);
      ctx.beginPath(); ctx.moveTo(sx1, sy1); ctx.lineTo(sx2, sy2); ctx.stroke();
      // ...and a brighter core inside it
      ctx.strokeStyle = `rgba(${Math.min(255,cr+34)},${Math.min(255,cg+34)},${Math.min(255,cb+34)},0.7)`;
      ctx.lineWidth = Math.max(0.6, 2.4 - s.d * 0.5);
      ctx.beginPath(); ctx.moveTo(sx1, sy1); ctx.lineTo(sx2, sy2); ctx.stroke();
    }

    // buds light at the tips as the plant fills out
    if (p.grow > 0.4){
      const f = Math.min(1, (p.grow - 0.4) / 0.5);
      for (const tp of p.tips){
        const bx = p.px + tp.x + w * (-tp.y), by = groundY + tp.y;
        const rad = 6 + 3 * Math.sin(t * 2 + p.phase);
        const bg = ctx.createRadialGradient(bx, by, 0, bx, by, rad);
        bg.addColorStop(0, `rgba(${Math.min(255,cr+34)},${Math.min(255,cg+44)},${Math.min(255,cb+44)},${0.6 * f})`);
        bg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = bg;
        ctx.beginPath(); ctx.arc(bx, by, rad, 0, Math.PI * 2); ctx.fill();
        // a hot white heart to the bloom
        ctx.fillStyle = `rgba(255,242,224,${0.5 * f})`;
        ctx.beginPath(); ctx.arc(bx, by, 1.3, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  // fireflies
  for (const fl of flies){
    const x = (fl.x + Math.sin(t * 0.3 * fl.sp + fl.drift) * 0.03) * W;
    const y = (fl.y + Math.cos(t * 0.22 * fl.sp + fl.drift) * 0.02) * H;
    const tw = 0.3 + 0.55 * (0.5 + 0.5 * Math.sin(t * 2 + fl.ph));
    const fg = ctx.createRadialGradient(x, y, 0, x, y, 7);
    fg.addColorStop(0, `rgba(244,202,142,${0.5 * tw})`);
    fg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
