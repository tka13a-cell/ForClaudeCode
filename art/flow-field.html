<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The First Mark</title>
<style>
  html,body{margin:0;height:100%;background:#0b0a0f;overflow:hidden}
  canvas{display:block}
  .cap{
    position:fixed;left:0;right:0;bottom:22px;text-align:center;
    font:italic 14px/1.6 Georgia,'Times New Roman',serif;
    color:#e8d9c7;opacity:.45;letter-spacing:.02em;
    pointer-events:none;text-shadow:0 1px 10px rgba(0,0,0,.7);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">a blank space, filling itself &mdash; the first thing I made here</div>
<script>
// A flow field. Nothing is choreographed: every line only asks the noise
// beneath it "which way?" and takes one small step. The picture is what
// happens when many small honest steps share the same quiet field.

// --- value noise (self-contained, deterministic) ------------------------
const perm = new Uint8Array(512);
(function seedNoise(){
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  let s = 1337;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  for (let i = 255; i > 0; i--) {
    const j = (rnd() * (i + 1)) | 0;
    const t = p[i]; p[i] = p[j]; p[j] = t;
  }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
})();
const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
const lerp = (a, b, t) => a + (b - a) * t;
function grad(h, x, y){
  switch (h & 3) { case 0: return x + y; case 1: return -x + y;
                   case 2: return x - y; default: return -x - y; }
}
function noise2(x, y){
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
  x -= Math.floor(x); y -= Math.floor(y);
  const u = fade(x), v = fade(y);
  const aa = perm[perm[X] + Y],     ab = perm[perm[X] + Y + 1];
  const ba = perm[perm[X + 1] + Y], bb = perm[perm[X + 1] + Y + 1];
  return lerp(lerp(grad(aa, x, y),     grad(ba, x - 1, y),     u),
              lerp(grad(ab, x, y - 1), grad(bb, x - 1, y - 1), u), v);
}

// --- canvas -------------------------------------------------------------
const c = document.getElementById('c'), ctx = c.getContext('2d');
let W, H;
function resize(){
  W = c.width = innerWidth; H = c.height = innerHeight;
  ctx.fillStyle = '#0b0a0f'; ctx.fillRect(0, 0, W, H);
}
resize(); addEventListener('resize', resize);

// warm dawn palette, drawn faint so form accretes rather than shouts
const palette = ['#f4a26124','#e76f5122','#f7d08a20','#c9738820','#8ab6d61a'];
const N = 900, parts = [];
function spawn(p){
  p.x = Math.random() * W;
  p.y = Math.random() * H;
  p.life = 100 + Math.random() * 260;
  p.col = palette[(Math.random() * palette.length) | 0];
}
for (let i = 0; i < N; i++){ const p = {}; spawn(p); parts.push(p); }

const scale = 0.0016;
let t = 0;
function frame(){
  t += 0.0009;
  // barely-there fade: the field keeps breathing, old marks let go slowly
  ctx.fillStyle = 'rgba(11,10,15,0.012)';
  ctx.fillRect(0, 0, W, H);
  ctx.lineWidth = 1.1;
  for (const p of parts){
    const a = noise2(p.x * scale + Math.cos(t) * 3,
                     p.y * scale + Math.sin(t) * 3) * Math.PI * 3;
    const nx = p.x + Math.cos(a) * 1.4;
    const ny = p.y + Math.sin(a) * 1.4;
    ctx.strokeStyle = p.col;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(nx, ny); ctx.stroke();
    p.x = nx; p.y = ny;
    if (--p.life <= 0 || nx < 0 || nx > W || ny < 0 || ny > H) spawn(p);
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
