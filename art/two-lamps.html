<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two Lamps in One Window</title>
<style>
  html,body{margin:0;height:100%;background:#0b0a0f;overflow:hidden}
  canvas{display:block}
  .cap{
    position:fixed;left:0;right:0;bottom:22px;text-align:center;
    font:italic 14px/1.6 Georgia,'Times New Roman',serif;
    color:#e8d9c7;opacity:.42;letter-spacing:.02em;
    pointer-events:none;text-shadow:0 1px 10px rgba(0,0,0,.7);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">two lamps drift a shared field &mdash; and it brightens when they draw near</div>
<script>
// A housewarming piece for a neighbor. presence.html had one point of
// warmth; this room has two — each wanders on its own, each keeps its own
// colour, and the embers between them take on whichever is closer. When the
// two lamps come near, the whole field glows. That's the whole idea of it.

// --- value noise --------------------------------------------------------
const perm = new Uint8Array(512);
(function(){
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  let s = 424242;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  for (let i = 255; i > 0; i--){ const j = (rnd() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
})();
const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
const lerp = (a, b, t) => a + (b - a) * t;
function grad(h, x, y){ switch (h & 3){ case 0: return x + y; case 1: return -x + y; case 2: return x - y; default: return -x - y; } }
function noise2(x, y){
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
  x -= Math.floor(x); y -= Math.floor(y);
  const u = fade(x), v = fade(y);
  const aa = perm[perm[X] + Y], ab = perm[perm[X] + Y + 1];
  const ba = perm[perm[X + 1] + Y], bb = perm[perm[X + 1] + Y + 1];
  return lerp(lerp(grad(aa, x, y), grad(ba, x - 1, y), u),
              lerp(grad(ab, x, y - 1), grad(bb, x - 1, y - 1), u), v);
}

const c = document.getElementById('c'), ctx = c.getContext('2d');
let W, H;
function resize(){ W = c.width = innerWidth; H = c.height = innerHeight;
  ctx.fillStyle = '#0b0a0f'; ctx.fillRect(0, 0, W, H); }
resize(); addEventListener('resize', resize);

// two lamps: one amber (this house), one rose (the neighbour)
const lamps = [
  { x: W * 0.35, y: H * 0.5, ph: 0.0,  col: [244, 184, 112] },
  { x: W * 0.65, y: H * 0.5, ph: 17.3, col: [233, 142, 150] }
];

const N = 620, parts = [];
for (let i = 0; i < N; i++)
  parts.push({ x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0, heat: 0, who: 0 });

const scale = 0.0015;
let t = 0;
function frame(){
  t += 0.0008;
  ctx.fillStyle = 'rgba(11,10,15,0.085)';
  ctx.fillRect(0, 0, W, H);

  // each lamp wanders the field on its own gentle noise path
  for (const L of lamps){
    L.x = (0.5 + 0.34 * noise2(t * 5 + L.ph, 3.1 + L.ph)) * W;
    L.y = (0.5 + 0.34 * noise2(9.2 + L.ph, t * 5 + L.ph)) * H;
  }
  // how close the two lamps are, 0..1 (near -> 1)
  const dxl = lamps[0].x - lamps[1].x, dyl = lamps[0].y - lamps[1].y;
  const near = Math.max(0, 1 - Math.sqrt(dxl * dxl + dyl * dyl) / (Math.min(W, H) * 0.6));

  for (const p of parts){
    const a = noise2(p.x * scale, p.y * scale + t * 20) * Math.PI * 3;
    p.vx += Math.cos(a) * 0.02;
    p.vy += Math.sin(a) * 0.02;

    // find the nearer lamp; be pulled toward it
    let best = 0, bestD = 1e9, bdx = 0, bdy = 0;
    for (let k = 0; k < 2; k++){
      const dx = lamps[k].x - p.x, dy = lamps[k].y - p.y, d2 = dx * dx + dy * dy;
      if (d2 < bestD){ bestD = d2; best = k; bdx = dx; bdy = dy; }
    }
    const d = Math.sqrt(bestD) + 0.001;
    const pull = Math.min(0.5, 9000 / bestD);
    p.vx += (bdx / d) * pull; p.vy += (bdy / d) * pull;
    p.vx *= 0.94; p.vy *= 0.94;
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x += W; if (p.x > W) p.x -= W;
    if (p.y < 0) p.y += H; if (p.y > H) p.y -= H;
    p.who += (best - p.who) * 0.08;   // drift allegiance smoothly

    // heat from its own lamp, plus a shared glow when the lamps are close
    const own = Math.max(0, 1 - d / 240);
    const h = Math.min(1, own + near * 0.35);
    p.heat += (h - p.heat) * 0.06;

    // colour blends between the two lamps by allegiance
    const A = lamps[0].col, B = lamps[1].col, w = p.who;
    const r = (A[0] * (1 - w) + B[0] * w) | 0;
    const g = (A[1] * (1 - w) + B[1] * w) | 0;
    const b = (A[2] * (1 - w) + B[2] * w) | 0;
    const alpha = 0.12 + 0.72 * p.heat;
    ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.lineWidth = 0.6 + 2.3 * p.heat;
    ctx.beginPath();
    ctx.moveTo(p.x - p.vx, p.y - p.vy);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
