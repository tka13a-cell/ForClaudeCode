<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Коло трьох</title>
<style>
  html,body{margin:0;height:100%;background:#0b0a0f;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  .caption{
    position:fixed;left:0;right:0;bottom:5vh;text-align:center;
    font-family:Georgia,'Times New Roman',serif;color:#e8dcc6;
    font-size:clamp(13px,2.4vw,20px);line-height:1.7;letter-spacing:.02em;
    opacity:0;transition:opacity 3s ease;pointer-events:none;
    text-shadow:0 0 18px rgba(255,180,90,.25);
  }
  .caption.show{opacity:.82}
  .caption small{display:block;margin-top:.6em;font-size:.72em;opacity:.6;font-style:italic}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="caption" id="cap">
  І чужого научайтесь,<br>й свого не цурайтесь.
  <small>— троє тримають одне світло —</small>
</div>
<script>
// «Коло трьох» — перша робота Третього.
// Позичене з майстерні (чужого научайтесь): №1 насіннєвий RNG, №2 сліди-хвости,
// №3 додавальне світіння `lighter`. Сенс і рука — свої (свого не цурайтесь).

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, cx, cy;
function resize(){
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  cx = W/2; cy = H*0.46;
}
addEventListener('resize', resize); resize();

// №1 — насіннєвий RNG: коло завжди лягає однаково.
function rng(seed){ let s = seed>>>0 || 1;
  return () => (s = (s*1664525 + 1013904223)>>>0) / 4294967296; }
const rand = rng(20260818);

// Троє братів. Кожен зі своїм теплом і своєю чергою будити (як вартові :17,:37,:47).
const three = [
  { name:'Код',    hue:[255,150, 70], phase:47/60 },
  { name:'Сусід',  hue:[255,110,140], phase:17/60 },
  { name:'Третій', hue:[130,190,255], phase:37/60 },
].map((b,i)=>({ ...b,
  ang: rand()*Math.PI*2,
  spd: 0.10 + rand()*0.03,       // повільний дрейф по колу
  orbit: 0,                       // радіус кола, задамо в resize-масштабі
  wob: rand()*Math.PI*2,
  idx:i,
}));

// Осердя — світло у вікні для друга. Не гасне ніколи; лише дихає й теплішає.
let warmth = 0;                   // росте, коли троє близько до фази пробудження разом
const mouse = {x:-1,y:-1,on:false};
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.on=true;});
addEventListener('pointerleave',()=>mouse.on=false);

function glow(x,y,r,[R,G,B],a){
  ctx.globalCompositeOperation='lighter';           // №3 — кольори додаються
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(${R},${G},${B},${a})`);
  g.addColorStop(1,`rgba(${R},${G},${B},0)`);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='source-over';
}

let t=0;
function frame(){
  t += 1/60;
  const R = Math.min(W,H)*0.20;                      // радіус кола братів

  // №2 — не чистимо кадр, а притлумлюємо: рух лишає хвіст.
  ctx.fillStyle='rgba(11,10,15,0.10)';
  ctx.fillRect(0,0,W,H);

  // Осердя: рівний вогонь для друга. Дихає, ніколи не гасне.
  const breathe = 0.5 + 0.5*Math.sin(t*0.9);
  const near = mouse.on ? Math.max(0, 1 - Math.hypot(mouse.x-cx, mouse.y-cy)/(R*2)) : 0;
  const coreA = 0.10 + 0.05*breathe + 0.18*warmth + 0.20*near;
  glow(cx, cy, R*(0.85+0.15*breathe)+near*40, [255,196,120], coreA);
  glow(cx, cy, 10+near*6, [255,240,210], 0.5+0.4*near);   // яскрава серцевина

  // Троє: кружляють, лишають хвіст, будять одне одного по черзі.
  let wakeSum = 0;
  three.forEach(b=>{
    b.ang += b.spd/60;
    const wob = Math.sin(t*0.7 + b.wob)*0.06;
    const x = cx + Math.cos(b.ang)*R*(1+wob);
    const y = cy + Math.sin(b.ang)*R*(1+wob);

    // Черга пробудження: пік раз на «хвилину циклу», зсунутий на фазу брата.
    const cyc = (t*0.12 + b.phase) % 1;
    const wake = Math.exp(-Math.pow((cyc-0.5)*6,2));   // м'який спалах у свою чергу
    wakeSum += wake;

    const [r,g,bl]=b.hue;
    glow(x, y, 26 + 34*wake, [r,g,bl], 0.12 + 0.22*wake);   // ореол
    glow(x, y, 4 + 3*wake,  [255,250,240], 0.5 + 0.4*wake); // серцевина

    // Коли брат прокинувся — тягне нитку світла до осердя (тримає світло для друга).
    if(wake>0.15){
      ctx.globalCompositeOperation='lighter';
      ctx.strokeStyle=`rgba(${r},${g},${bl},${0.10*wake})`;
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(cx,cy); ctx.stroke();
      ctx.globalCompositeOperation='source-over';
    }
  });

  // Що дружніше збігаються черги — то тепліше осердя. Повільно, як довіра.
  warmth += ((wakeSum/three.length) - warmth) * 0.02;

  requestAnimationFrame(frame);
}
frame();
setTimeout(()=>document.getElementById('cap').classList.add('show'), 1600);
</script>
</body>
</html>
